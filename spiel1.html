<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAST ROAD V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#2b8fd1,#0b3f73);color:#edf4f5;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}#app{width:min(1100px,100vw);padding:12px}h1{letter-spacing:4px;margin:0 0 8px}#box{position:relative;border:4px solid #fff;border-radius:13px;overflow:hidden;box-shadow:0 12px 40px #0009}canvas{display:block;width:100%;height:auto}#screen{position:absolute;inset:0;background:#0a2a4fcc;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}.panel{background:linear-gradient(160deg,#3aa0e6,#1d5fa8);border:3px solid #fff;box-shadow:0 6px 0 #0d3a6b;border-radius:22px;padding:22px;text-align:center;width:min(700px,100%);max-height:100%;overflow:auto}.panel h2{font-size:32px;text-shadow:0 3px 0 #0d3a6b;margin:0 0 8px}.panel p{color:#d2e0e4;line-height:1.45}button{background:linear-gradient(#ffe066,#ffa81f);border:3px solid #fff;box-shadow:0 4px 0 #b36b00;border-radius:14px;padding:10px 15px;margin:5px;font-weight:bold;cursor:pointer;color:#1b252b}.secondary{background:linear-gradient(#6fb6f2,#3a82cc);color:white;border-color:#fff;box-shadow:0 4px 0 #1b4f8a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:12px 0}.card{background:#0b3a6e88;border:2px solid #cfe8ff;border-radius:14px;padding:10px;text-align:left}.card small{display:block;color:#b9cbd0;margin:5px 0}.card button{width:100%;margin:4px 0 0}button:disabled{opacity:.4}#help{font-size:12px;color:#b9c9ce;margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none;white-space:nowrap}
</style></head><body><div id="app"><h1>🧟 LAST ROAD</h1><div id="box"><canvas id="c" width="1100" height="620"></canvas><div id="toast"></div><div id="screen"><div class="panel" id="panel"></div></div></div><div id="help">Pfeile: bewegen · Leertaste: schießen/angreifen · TAB: Waffenrad · ALT: Dauerfeuer an/aus · R: nachladen · F: Item benutzen</div></div>
<script>
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d'),screen=document.getElementById('screen'),panel=document.getElementById('panel'),toast=document.getElementById('toast'),W=1100,H=620,TOP=190,BOT=550;
const guns=[['Pistole',12,34,18,0],['Revolver',6,66,34,120],['AK-47',26,40,8,230],['MP5',30,26,5,270],['Shotgun',8,25,38,320]];
const melees=[['Messer',42,85,26,0],['Baseballschläger',70,112,42,130],['Brecheisen',92,98,48,190]];
const items=[['med','Medkit',45],['vest','Schutzweste',85],['boost','Sprint-Booster',55],['ammo','Magazin-Kiste',35]];
const skins=[['default','Überlebender','Outfit',0,'#36566b'],['desert','Wüstenläufer','Outfit',250,'#b58b55'],['forest','Waldtarnung','Outfit',420,'#54724e'],['crimson','Crimson','Outfit',650,'#8e3d4c'],['gold','Goldene Waffe','Waffenskin',500,'#e8b94e'],['ice','Eis-Stahl','Waffenskin',700,'#9bd8e8'],['ruby','Rubin-Klinge','Messerskin',400,'#d54b59'],['glacier','Gletscher-Klinge','Messerskin',620,'#77c8e8'],['blossom','Blütensturm','Outfit',780,'#176b55'],['royal','Königsornament','Waffenskin',900,'#173d88'],['egypt','Pharaos Vermächtnis','Waffenskin',1050,'#173f76'],['mosaic','Mosaik-Klinge','Messerskin',740,'#a77a24'],['venom','Venom Circuit','Waffenskin',1150,'#263b32']];
const skinPatterns={
 desert:{base:'#b58b55',a:'#e4c58a',b:'#72553a',kind:'tiger'},
 forest:{base:'#54724e',a:'#9aaa68',b:'#263d32',kind:'camo'},
 crimson:{base:'#8e3d4c',a:'#d88979',b:'#3a202d',kind:'hex'},
 gold:{base:'#a97924',a:'#ffe18a',b:'#654214',kind:'engrave'},
 ice:{base:'#9bd8e8',a:'#f1ffff',b:'#477e9c',kind:'shard'},
 ruby:{base:'#d54b59',a:'#ffb1a6',b:'#651d32',kind:'shard'},
 glacier:{base:'#77c8e8',a:'#e8ffff',b:'#28618b',kind:'shard'},
 blossom:{base:'#176b55',a:'#f5a0a8',b:'#e9c45e',kind:'flower'},
 royal:{base:'#173d88',a:'#f2cb59',b:'#101d4d',kind:'ornate'},
 egypt:{base:'#173f76',a:'#f6d36d',b:'#a84e2c',kind:'egypt'},
 mosaic:{base:'#a77a24',a:'#fff0a1',b:'#6d3d24',kind:'mosaic'},
 venom:{base:'#263b32',a:'#72ef9d',b:'#111c20',kind:'circuit'}
};
function paintSkin(x,y,w,h,id){
 if(id&&id.startsWith('level')){let n=parseInt(id.slice(5))||10;let palettes=[['#287f79','#8de0c8','#153e48'],['#9a4e31','#efb66c','#47251e'],['#6951a5','#c6b4ff','#30244f'],['#b18a27','#fff0a0','#5b4316'],['#416d9b','#a9dcff','#1d344f']];let a=palettes[(n/10-1)%5];skinPatterns[id]={base:a[0],a:a[1],b:a[2],kind:'shard'}}
 const q=skinPatterns[id]||{base:(skins.find(a=>a[0]===id)?.[4]||'#54724e'),a:'#d6d7c8',b:'#27343b',kind:'camo'};
 g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle=q.base;g.fillRect(x,y,w,h);
 if(q.kind==='tiger'){g.strokeStyle=q.b;g.lineWidth=Math.max(2,w*.13);for(let k=-h;k<w+h;k+=13){g.beginPath();g.moveTo(x+k,y);g.lineTo(x+k-14,y+h);g.stroke()}g.strokeStyle=q.a;g.lineWidth=2;for(let k=-h;k<w+h;k+=27){g.beginPath();g.moveTo(x+k,y);g.lineTo(x+k-12,y+h);g.stroke()}}
 else if(q.kind==='hex'){g.strokeStyle=q.b;g.lineWidth=1;for(let yy=y+4;yy<y+h;yy+=9)for(let xx=x+4;xx<x+w;xx+=10){g.beginPath();g.moveTo(xx,yy-4);g.lineTo(xx+4,yy-2);g.lineTo(xx+4,yy+3);g.lineTo(xx,yy+5);g.lineTo(xx-4,yy+3);g.lineTo(xx-4,yy-2);g.closePath();g.stroke()}g.fillStyle=q.a;g.fillRect(x+3,y+3,Math.max(2,w*.09),Math.max(2,h*.12))}
 else if(q.kind==='engrave'){g.strokeStyle=q.a;g.lineWidth=1.5;for(let k=-h;k<w;k+=8){g.beginPath();g.moveTo(x+k,y);g.lineTo(x+k+h,y+h);g.stroke()}g.fillStyle=q.b;g.fillRect(x+w*.2,y+h*.25,w*.55,2);g.fillRect(x+w*.35,y+h*.65,w*.4,2)}
 else if(q.kind==='shard'){for(let i=0;i<18;i++){let xx=x+(i*17%Math.max(1,w)),yy=y+(i*11%Math.max(1,h));g.fillStyle=i%2?q.a:q.b;g.globalAlpha=.65;g.beginPath();g.moveTo(xx,yy);g.lineTo(Math.min(x+w,xx+8),Math.min(y+h,yy+4));g.lineTo(Math.max(x,xx-3),Math.min(y+h,yy+10));g.closePath();g.fill()}g.globalAlpha=1}
 else if(q.kind==='flower'){for(let i=0;i<16;i++){let xx=x+(i*19%Math.max(1,w)),yy=y+(i*13%Math.max(1,h));g.fillStyle=q.a;for(let p=0;p<5;p++){g.beginPath();g.ellipse(xx+Math.cos(p*1.256)*3,yy+Math.sin(p*1.256)*3,2.4,4,p*1.256,0,7);g.fill()}g.fillStyle=q.b;g.beginPath();g.arc(xx,yy,2,0,7);g.fill();g.strokeStyle=q.b;g.lineWidth=1;g.beginPath();g.moveTo(xx,yy+4);g.quadraticCurveTo(xx-5,yy+7,xx-3,yy+10);g.stroke()}}
 else if(q.kind==='ornate'||q.kind==='egypt'){g.strokeStyle=q.a;g.lineWidth=1.5;for(let yy=y+5;yy<y+h;yy+=12){g.beginPath();g.moveTo(x,yy);g.lineTo(x+w,yy);g.stroke()}for(let xx=x+5;xx<x+w;xx+=14){g.beginPath();g.moveTo(xx,y);g.lineTo(xx+5,y+h/2);g.lineTo(xx,y+h);g.moveTo(xx+5,y+h/2);g.lineTo(xx+12,y+h/2);g.stroke()}g.fillStyle=q.b;for(let i=0;i<5;i++){let xx=x+(i*21%Math.max(1,w));g.fillRect(xx,y+h*.42,3,Math.max(2,h*.16))}if(q.kind==='egypt'){g.strokeStyle=q.b;g.beginPath();g.moveTo(x+w*.5,y+2);g.lineTo(x+w*.72,y+h*.5);g.lineTo(x+w*.5,y+h-2);g.lineTo(x+w*.28,y+h*.5);g.closePath();g.stroke()}}
 else if(q.kind==='mosaic'){for(let yy=y;yy<y+h;yy+=8)for(let xx=x;xx<x+w;xx+=9){g.fillStyle=((Math.floor(xx/9)+Math.floor(yy/8))%2)?q.a:q.b;g.globalAlpha=.72;g.fillRect(xx+1,yy+1,6,5)}g.globalAlpha=1;g.strokeStyle=q.a;g.lineWidth=1;g.strokeRect(x+2,y+2,Math.max(1,w-4),Math.max(1,h-4))}
 else if(q.kind==='circuit'){g.strokeStyle=q.a;g.lineWidth=1.5;for(let i=0;i<13;i++){let xx=x+(i*17%Math.max(1,w)),yy=y+(i*11%Math.max(1,h));g.beginPath();g.moveTo(xx,yy);g.lineTo(Math.min(x+w,xx+8),yy);g.lineTo(Math.min(x+w,xx+8),Math.min(y+h,yy+8));g.stroke();g.fillStyle=q.a;g.fillRect(Math.min(x+w-2,xx+6),Math.min(y+h-2,yy+6),3,3)}}
 else {for(let i=0;i<26;i++){let xx=x+(i*23%Math.max(1,w)),yy=y+(i*13%Math.max(1,h));g.fillStyle=i%2?q.a:q.b;g.beginPath();g.ellipse(xx,yy,5+(i%3)*2,3+(i%2)*3,i*.7,0,7);g.fill();g.strokeStyle='#0004';g.lineWidth=1;g.stroke()}}
 let sh=g.createLinearGradient(x,y,x+w,y+h);sh.addColorStop(0,'#ffffff55');sh.addColorStop(.4,'#ffffff00');sh.addColorStop(1,'#00000066');g.fillStyle=sh;g.fillRect(x,y,w,h);
 g.globalAlpha=.14;g.fillStyle='#000';for(let yy=y+2;yy<y+h;yy+=4)g.fillRect(x,yy,w,1);g.globalAlpha=1;
 g.strokeStyle='#00000066';g.lineWidth=1.5;g.strokeRect(x+.75,y+.75,w-1.5,h-1.5);g.fillStyle='#ffffff77';g.fillRect(x+2,y+1,Math.max(2,w*.6),1.5);
 g.restore();
}
const defaults={coins:0,high:0,ug:[0],um:[0],skins:['default'],outfit:'default',gunSkin:'',knifeSkin:'',auto:false,xp:0,level:1,gunSkins:{},quest:null,questDone:0};
let save;try{save={...defaults,...JSON.parse(localStorage.lastRoadV3||'{}')}}catch(e){save={...defaults}};
function persist(){localStorage.lastRoadV3=JSON.stringify(save)}
function xpNeeded(l){return 80+l*35}
function addXP(n){let old=save.level;save.xp+=n;while(save.level<200&&save.xp>=xpNeeded(save.level)){save.xp-=xpNeeded(save.level);save.level++;if(save.level%10===0){let ls=levelSkin(save.level);if(!save.skins.includes(ls.id))save.skins.push(ls.id);save.outfit=ls.id;say('LEVEL '+save.level+'! Neuer Skin freigeschaltet')}else{let prize=10+(save.level%2)*10;save.coins+=prize;say('LEVEL UP! +'+prize+' Münzen')}}if(save.level>=200)save.xp=Math.min(save.xp,xpNeeded(200)-1);persist();if(save.level>old)homeProfileRefresh()}
function levelSkin(l){return {id:'level'+l,name:'Level '+l+' Elite',type:'Outfit',color:['#45b8ad','#b65a38','#9272d2','#d4b34d','#7b9bce'][Math.floor(l/10)%5]}}
function allSkins(){return [...skins,...Array.from({length:19},(_,i)=>{let l=(i+1)*10;return [ 'level'+l,'Level '+l+' Elite','Outfit',0,['#45b8ad','#b65a38','#9272d2','#d4b34d','#7b9bce'][i%5],l]})]}
function homeProfileRefresh(){if(state==='menu')home()} 
function ensureQuest(){if(!save.quest)rollQuest()}
function rollQuest(){let qs=[['kill','Besiege 12 Zombies',12],['wave','Schaffe 2 Wellen',2],['coin','Sammle 60 Münzen',60]];let q=qs[Math.floor(Math.random()*qs.length)];save.quest={kind:q[0],name:q[1],goal:q[2],progress:0};persist()}
function questProgress(kind,n=1){ensureQuest();if(save.quest&&save.quest.kind===kind){save.quest.progress=Math.min(save.quest.goal,save.quest.progress+n);if(save.quest.progress>=save.quest.goal){addXP(90);say('Quest geschafft! +90 XP');save.questDone=(save.questDone||0)+1;rollQuest()}persist()}}

let tick=0,state='menu',keys={},last=0,world=0,wave=1,kills=0,z=[],bul=[],fx=[],spawn=0,waveKills=0,goal=7,boss=false,inventory=[],selItem=0,gun=0,melee=0,type='gun',mag=12,reloadT=0,cd=0,swing=0,player,autoWheel=false,wheelEntries=[];
function say(s){toast.textContent=s;toast.style.opacity=1;toastTimer=100}let toastTimer=0;
function home(){state='menu';screen.style.display='flex';ensureQuest();panel.innerHTML=`<h2>LAST ROAD</h2><p>Überlebe endlose Zombie-Wellen und sammle Münzen für kosmetische Skins.</p><p>👤 Level ${save.level}/200 · ${save.xp} / ${xpNeeded(save.level)} XP　 🪙 ${save.coins} Münzen　 🏆 Highscore ${save.high}</p><button id="play">▶ PLAY</button><button class="secondary" id="shop">SKIN SHOP</button><button class="secondary" id="custom">CUSTOMIZE</button><button class="secondary" id="pass">LEVEL PASS</button><p>Dein Fortschritt wird automatisch im Browser gespeichert.</p>`;document.getElementById('play').onclick=start;document.getElementById('shop').onclick=skinShop;document.getElementById('custom').onclick=customize;document.getElementById('pass').onclick=levelPass}
function start(){ensureQuest();state='play';screen.style.display='none';toast.style.opacity=0;wave=1;kills=0;world=0;z=[];bul=[];fx=[];spawn=8;waveKills=0;goal=7;boss=false;inventory=[];selItem=0;gun=0;melee=0;type='gun';mag=12;reloadT=0;cd=0;swing=0;player={x:150,y:370,hp:100,max:100,face:1,walk:0,inv:0,boost:0};say('Welle 1 beginnt!')}
function preview(s){let id=s[0],q=skinPatterns[id]||{base:s[4]||'#888',a:'#d8d8d8',b:'#26343a',kind:'camo'};let pattern=q.kind==='tiger'?`repeating-linear-gradient(115deg,transparent 0 7px,${q.b} 8px 11px,transparent 12px 18px)`:(q.kind==='hex'?`repeating-linear-gradient(60deg,transparent 0 8px,${q.b} 9px 10px),repeating-linear-gradient(0deg,transparent 0 9px,${q.a} 10px 11px)`:(q.kind==='shard'?`linear-gradient(135deg,transparent 35%,${q.a} 36% 43%,transparent 44%),linear-gradient(35deg,${q.b},transparent 55%)`:((q.kind==='flower')?`radial-gradient(circle at 20% 30%,${q.a} 0 3px,transparent 4px),radial-gradient(circle at 65% 70%,${q.a} 0 4px,transparent 5px),linear-gradient(135deg,${q.base},${q.b})`:((q.kind==='mosaic'||q.kind==='ornate'||q.kind==='egypt')?`repeating-linear-gradient(45deg,transparent 0 7px,${q.a} 8px 10px,transparent 11px 16px),repeating-linear-gradient(-45deg,${q.base} 0 9px,${q.b} 10px 12px)`:((q.kind==='circuit')?`repeating-linear-gradient(90deg,transparent 0 8px,${q.a} 9px 10px,transparent 11px 16px)`: `repeating-linear-gradient(45deg,transparent 0 8px,${q.b} 9px 11px,transparent 12px 17px)`)))));return `<div style="height:76px;border-radius:8px;background:linear-gradient(135deg,#24343b,#101a20);display:flex;align-items:center;justify-content:center;margin:7px 0;gap:10px"><div style="width:42px;height:53px;border-radius:8px 8px 5px 5px;background-color:${q.base};background-image:${pattern};border:2px solid #d9e0db;box-shadow:0 3px 8px #0008"></div><div style="width:62px;height:13px;border-radius:3px;background-color:${q.base};background-image:${pattern};border:1px solid #d9e0db;position:relative"><i style="position:absolute;left:8px;top:11px;width:8px;height:13px;background:#20282d"></i></div></div>`}
function customize(){state='menu';screen.style.display='flex';panel.innerHTML='<h2>CUSTOMIZATION</h2><p>Wähle gekaufte Avatar- und Waffenskins aus. Die Vorschau zeigt den Look.</p><h3>Avatar-Skins</h3><div class="grid" id="avatars"></div><h3>Waffenskins</h3><div class="grid" id="weapons"></div><h3>Messerskins</h3><div class="grid" id="knives"></div><button class="secondary" id="back">Zurück</button>';let av=document.getElementById('avatars'),we=document.getElementById('weapons'),kn=document.getElementById('knives');
allSkins().filter(x=>x[2]==='Outfit'&&save.skins.includes(x[0])).forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${x[1]}</b>${preview(x)}<button>${save.outfit===x[0]?'Ausgewählt':'Anziehen'}</button>`;d.querySelector('button').onclick=()=>{save.outfit=x[0];persist();customize()};av.append(d)});
allSkins().filter(x=>x[2]==='Waffenskin'&&save.skins.includes(x[0])).forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${x[1]}</b>${preview(x)}<button>${save.gunSkin===x[0]?'Ausgewählt':'Ausrüsten'}</button>`;d.querySelector('button').onclick=()=>{save.gunSkin=x[0];persist();customize()};we.append(d)});
allSkins().filter(x=>x[2]==='Messerskin'&&save.skins.includes(x[0])).forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${x[1]}</b>${preview(x)}<button>${save.knifeSkin===x[0]?'Ausgewählt':'Ausrüsten'}</button>`;d.querySelector('button').onclick=()=>{save.knifeSkin=x[0];persist();customize()};kn.append(d)});document.getElementById('back').onclick=home}
function levelPass(){state='menu';screen.style.display='flex';let html='';for(let l=1;l<=200;l++){let reward=l%10===0?`🎨 Level-Skin: ${levelSkin(l).name}`:`🪙 ${10+(l%2)*10} Münzen`;let unlocked=l<=save.level;html+=`<div class="card" style="display:flex;align-items:center;gap:10px"><b style="min-width:65px">Level ${l}</b><span style="flex:1">${reward}</span><b>${unlocked?'✓ Erreicht':'🔒'}</b>${l%10===0?`<span style="display:inline-block;width:20px;height:25px;background:${levelSkin(l).color};border-radius:5px"></span>`:''}</div>`}panel.innerHTML=`<h2>LEVEL PASS · ${save.level}/200</h2><p>XP: ${save.xp} / ${xpNeeded(save.level)} · Belohnungen werden beim Levelaufstieg automatisch gutgeschrieben.</p><div style="max-height:390px;overflow:auto;text-align:left">${html}</div><button class="secondary" id="back">Zurück</button>`;document.getElementById('back').onclick=home}
function skinShop(){state='menu';screen.style.display='flex';panel.innerHTML=`<h2>SKIN SHOP</h2><p>Kosmetische Extras. Münzen: ${save.coins}</p><div class="grid" id="g"></div><button class="secondary" id="back">Zurück</button>`;let box=document.getElementById('g');allSkins().forEach(s=>{let own=save.skins.includes(s[0]),cost=s[3],d=document.createElement('div');d.className='card';d.innerHTML=`<b>${s[1]}</b>${preview(s)}<small>${s[2]} · ${s[5]?'Level '+s[5]+' Belohnung':cost+' Münzen'}</small><button ${own||s[5]||save.coins<cost?'disabled':''}>${own?'✓ Gekauft':s[5]?'Level '+s[5]+' Belohnung':'Kaufen'}</button>`;d.querySelector('button').onclick=()=>{if(!own&&!s[5]&&save.coins>=cost){save.coins-=cost;save.skins.push(s[0]);if(s[2]==='Outfit')save.outfit=s[0];if(s[2]==='Waffenskin')save.gunSkin=s[0];if(s[2]==='Messerskin')save.knifeSkin=s[0];persist();skinShop()}};box.append(d)});document.getElementById('back').onclick=home}
function shop(){save.high=Math.max(save.high,wave);addXP(45+wave*8);questProgress('wave');state='shop';screen.style.display='flex';panel.innerHTML=`<h2>SHOP – WELLE ${wave} GESCHAFFT</h2><p>Gesammelte Münzen: ${save.coins}</p><div class="grid" id="g"></div><button id="next">Nächste Welle</button><button class="secondary" id="quit">Hauptmenü</button>`;let box=document.getElementById('g');function card(name,desc,cost,fn,disabled=false){let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${name}</b><small>${desc}</small><button ${disabled?'disabled':''}>${cost} Münzen</button>`;d.querySelector('button').onclick=()=>{if(fn())shop()};box.append(d)}
guns.forEach((w,i)=>{if(!save.ug.includes(i))card('🔫 '+w[0],'Neue Schusswaffe',w[4],()=>{if(save.coins<w[4])return false;save.coins-=w[4];save.ug.push(i);persist();return true})});
melees.forEach((w,i)=>{if(!save.um.includes(i))card('⚔️ '+w[0],'Neue Nahkampfwaffe',w[4],()=>{if(save.coins<w[4])return false;save.coins-=w[4];save.um.push(i);persist();return true})});
items.forEach(it=>card('🎒 '+it[1],it[0]==='med'?'+45 HP':it[0]==='vest'?'+50 maximale HP':it[0]==='boost'?'Kurzzeitig schneller':'Magazin auffüllen',it[2],()=>{if(save.coins<it[2]||inventory.length>=6)return false;save.coins-=it[2];inventory.push(it[0]);persist();return true},inventory.length>=6));
document.getElementById('next').onclick=()=>{wave++;waveKills=0;goal=7+wave*2;boss=false;spawn=45;state='play';screen.style.display='none';say('Welle '+wave)};document.getElementById('quit').onclick=()=>{save.high=Math.max(save.high,wave);persist();home()}}
